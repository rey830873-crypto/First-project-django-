{% extends "contacts/base.html" %}

{% block title %}Liste - Carnet de contacts{% endblock %}

{% block content %}
<h2>Liste des contacts</h2>
<ul>
    {% for contact in contacts %}
    <li>
        <a href="{% url 'detail' contact.id %}">
            {{ contact.prenom }} {{ contact.nom }}
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
